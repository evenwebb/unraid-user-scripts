name: Generate User Scripts Plugin Folders

on:
  push:
    branches:
      - main
    paths:
      - '*.sh'
      - 'README.md'
      - '.github/scripts/generate_folders.py'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-folders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1  # Shallow clone for faster checkout
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'  # Use latest 3.x for faster setup

      - name: Validate bash syntax (bash -n)
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          errors=0
          count=0
          for sh in *.sh; do
            [[ -f "$sh" ]] || continue
            count=$((count + 1))
            echo "bash -n: $sh ..."
            bash -n "$sh" || errors=$((errors + 1))
          done
          shopt -s nullglob || true
          for fs in user-scripts-folders/*/script; do
            count=$((count + 1))
            echo "bash -n: $fs ..."
            bash -n "$fs" || errors=$((errors + 1))
          done
          shopt -u nullglob || true
          [[ "$errors" -eq 0 ]]
          echo "--- All $count script(s) passed bash -n."
      
      - name: Generate User Scripts folders
        run: |
          python3 .github/scripts/generate_folders.py
      
      - name: Check for changes and commit
        run: |
          if [ -n "$(git status --porcelain user-scripts-folders/)" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add user-scripts-folders/
            if git diff --staged --quiet; then
              echo "No changes to commit after git add"
              exit 0
            fi
            git commit -m "Auto-generate User Scripts plugin folders [skip ci]"
            git push origin main || {
              echo "Push failed, attempting to pull and retry..."
              git pull --rebase origin main || true
              git push origin main || {
                echo "Push failed after retry. This may indicate a conflict."
                exit 1
              }
            }
          else
            echo "No changes to commit"
          fi
